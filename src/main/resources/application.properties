spring.application.name=notification-service
server.port=8081

# ========== Kafka Config ==========
kafka.bootstrap-servers=${KAFKA_SERVER_HOSTNAME}

kafka.topics.email.name=email-topics
kafka.topics.email.partitions=3

kafka.topics.sms.name=sms-topic
kafka.topics.sms.partitions=2

kafka.topics.whatsapp.name=whatsapp-topic
kafka.topics.whatsapp.partitions=2

kafka.consumer.group-id=notification-service-group

# ========== Spring Kafka Consumer ==========
spring.kafka.consumer.bootstrap-servers=${kafka.bootstrap-servers}
spring.kafka.consumer.group-id=${kafka.consumer.group-id}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.send.email.dtos

# ========== Spring Hibernate =============
spring.datasource.url=${DATABASE_USER_DB_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DATABASE_DRIVER}
spring.jpa.database-platform=${DATABASE_DIALECT}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true